<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .animate-fade-in {
            animation: fadeIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .animate-slide-up {
            animation: slideUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
        }

        .animate-progress {
            animation: progress 3s linear infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .logo-glow {
            filter: drop-shadow(0 0 15px rgba(0, 83, 219, 0.15));
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

<main class="relative w-full max-w-lg mx-auto px-lg flex flex-col items-center justify-center h-screen space-y-xl">
<!-- Animated Background Element (Subtle) -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20">

                        auto_awesome

</div>

                AI-powered Ga Speech Transcription &amp; English Translation
            </p>
</div>
<!-- Status & Loading -->
<div class="fixed bottom-xl w-full max-w-[240px] px-container-margin animate-slide-up" style="animation-delay: 0.6s">
<div class="flex flex-col items-center space-y-md">
<!-- Loading Indicator -->
<div class="w-full h-[2px] bg-surface-container rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full w-full bg-primary animate-progress"></div>
</div>
<!-- Status Text -->
<span class="font-label-md text-label-md text-outline uppercase tracking-widest opacity-80">
                    Initializing Engine...
                </span>
</div>
</div>
<!-- Decorative Card Detail (Glassmorphism influence) -->
<div class="absolute bottom-10 left-10 w-24 h-24 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute top-10 right-10 w-32 h-32 bg-secondary-container/10 rounded-full blur-3xl"></div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progress = document.querySelector('.animate-progress');
            const statusText = document.querySelector('.font-label-md');
            
            const statuses = [
                "Initializing Engine...",
                "Loading Language Models...",
                "Authenticating Session...",
                "HAKI is Ready"
            ];

            let step = 0;
            const interval = setInterval(() => {
                if (step < statuses.length - 1) {
                    step++;
                    statusText.textContent = statuses[step];
                    statusText.classList.add('animate-pulse');
                    setTimeout(() => statusText.classList.remove('animate-pulse'), 500);
                } else {
                    clearInterval(interval);
                    // Optional: Trigger transition to main dashboard here
                }
            }, 1000);
        });
    </script>
