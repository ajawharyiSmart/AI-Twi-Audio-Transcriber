<!-- Micro-Interaction Script -->
<script>
        // Simple scale effect on tap for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('opacity-80', 'scale-98');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('opacity-80', 'scale-98');
            });
        });

        // Interactive background particle effect (subtle)
        const canvas = document.createElement('canvas');
        canvas.className = 'fixed inset-0 pointer-events-none opacity-20';
        document.body.prepend(canvas);
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        const particles = Array.from({ length: 15 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 2 + 1,
            vx: Math.random() * 0.5 - 0.25,
            vy: Math.random() * 0.5 - 0.25
        }));

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#2563eb';
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
