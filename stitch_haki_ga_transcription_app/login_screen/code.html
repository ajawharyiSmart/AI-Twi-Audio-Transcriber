<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HAKI - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-tint": "#0053db",
                    "tertiary-fixed-dim": "#ffb596",
                    "primary-container": "#2563eb",
                    "inverse-on-surface": "#eef0ff",
                    "inverse-surface": "#283044",
                    "on-primary-fixed": "#00174b",
                    "primary-fixed-dim": "#b4c5ff",
                    "error": "#ba1a1a",
                    "surface": "#faf8ff",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#360f00",
                    "primary": "#004ac6",
                    "surface-container-high": "#e2e7ff",
                    "background": "#faf8ff",
                    "on-surface-variant": "#434655",
                    "surface-container-low": "#f2f3ff",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#005236",
                    "secondary-fixed-dim": "#4edea3",
                    "on-tertiary-container": "#ffede6",
                    "tertiary": "#943700",
                    "on-primary-container": "#eeefff",
                    "surface-bright": "#faf8ff",
                    "outline-variant": "#c3c6d7",
                    "secondary-fixed": "#6ffbbe",
                    "tertiary-fixed": "#ffdbcd",
                    "inverse-primary": "#b4c5ff",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#131b2e",
                    "on-secondary-container": "#00714d",
                    "on-primary": "#ffffff",
                    "primary-fixed": "#dbe1ff",
                    "error-container": "#ffdad6",
                    "surface-container": "#eaedff",
                    "outline": "#737686",
                    "on-secondary-fixed": "#002113",
                    "surface-container-highest": "#dae2fd",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-error": "#ffffff",
                    "on-surface": "#131b2e",
                    "secondary-container": "#6cf8bb",
                    "surface-variant": "#dae2fd",
                    "secondary": "#006c49",
                    "tertiary-container": "#bc4800",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d2d9f4"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "16px",
                    "xl": "32px",
                    "unit": "4px",
                    "xs": "4px",
                    "lg": "24px",
                    "container-margin": "16px",
                    "gutter": "12px",
                    "sm": "8px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "headline-sm": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg": ["Inter"],
                    "transcription-text": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "transcription-text": ["18px", {"lineHeight": "32px", "letterSpacing": "0.01em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .soft-elevation {
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }
        .ai-glow-pulse {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center p-md overflow-x-hidden">
<!-- Background Atmospheric Element -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute -top-1/4 -right-1/4 w-96 h-96 bg-primary-container rounded-full blur-[120px] ai-glow-pulse"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-96 h-96 bg-secondary-container rounded-full blur-[120px] ai-glow-pulse" style="animation-delay: 1.5s;"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[400px] flex flex-col gap-lg">
<!-- Brand Identity -->
<header class="flex flex-col items-center text-center gap-sm">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-md soft-elevation">
<span class="material-symbols-outlined text-on-primary text-[32px]">architecture</span>
</div>
<h1 class="text-display-lg font-display-lg text-on-background tracking-tight">HAKI</h1>
<p class="text-body-md font-body-md text-on-surface-variant max-w-[280px]">
                Precision AI-powered transcription for the Ga language.
            </p>
</header>
<!-- Login Form Card -->
<div class="bg-surface-container-lowest p-xl rounded-xl soft-elevation border border-outline-variant flex flex-col gap-lg">
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface-variant uppercase ml-1" for="email">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-md pl-[48px] pr-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-10 focus:border-primary transition-all placeholder:text-outline" id="email" placeholder="your@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-1">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="password">Password</label>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-md pl-[48px] pr-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-10 focus:border-primary transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password (Ghost) -->
<div class="flex justify-end">
<button class="text-label-md font-label-md text-primary hover:text-on-primary-fixed-variant transition-colors p-xs rounded-sm hover:bg-surface-container-low" type="button">
                        Forgot Password?
                    </button>
</div>
<!-- Sign In Button (Primary) -->
<button class="w-full bg-primary text-on-primary py-md rounded-lg font-headline-sm text-headline-sm transition-all hover:bg-on-primary-fixed-variant active:scale-[0.98] mt-sm flex items-center justify-center gap-sm shadow-md shadow-primary/20" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center gap-md">
<div class="h-[1px] flex-grow bg-outline-variant"></div>
<span class="text-label-md font-label-md text-outline">OR</span>
<div class="h-[1px] flex-grow bg-outline-variant"></div>
</div>
<!-- Social/Secondary (Optional but improves layout balance) -->
<button class="w-full bg-surface border border-outline-variant text-on-surface py-md rounded-lg font-body-md flex items-center justify-center gap-sm hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-error">google</span>
                Continue with Google
            </button>
</div>
<!-- Footer Link -->
<footer class="text-center">
<p class="text-body-sm font-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-semibold hover:underline transition-all" href="#">Create Account</a>
</p>
</footer>
</main>
<!-- Language Decorator -->
<div class="fixed bottom-lg right-lg hidden md:flex items-center gap-sm text-on-surface-variant opacity-50">
<span class="text-label-md font-label-md">EN | GA</span>
<span class="material-symbols-outlined text-[16px]">translate</span>
</div>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple button active state visual feedback enhancement
        const mainBtn = document.querySelector('button[type="submit"]');
        mainBtn.addEventListener('mousedown', () => mainBtn.style.transform = 'scale(0.97)');
        mainBtn.addEventListener('mouseup', () => mainBtn.style.transform = 'scale(1)');
        mainBtn.addEventListener('mouseleave', () => mainBtn.style.transform = 'scale(1)');
    </script>
</body></html>
