<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-surface docked full-width top-0 flex justify-between items-center w-full px-container-margin py-sm h-16 sticky z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a modern Ghanian technologist with a warm smile, wearing minimalist professional attire. The background is a clean, bright white studio setting with soft cinematic lighting that highlights the intelligent and friendly persona. The overall aesthetic is high-end, clean, and modern light-mode." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDkErAgddq7YAgSBM8BgnM3Y7tMlSIq-cVm0p8WasS-VBT7K3p-pzZgb30BtD4FYD2dMVOVfZ4I2IlbP6kYppMsScCI9F844tU_Dgb39F1Abmr57CW3cGJJSeGHTSYAUjYGHDa_1OVeoTO0yn5jsU5bTdionbMSGsbRxgk0ffEcajDFsTrQbTHGX_n6uv1cQtiIqp159Agkau74z0K_0ePr_CKg2yuFKEqzszVGFskmJt6X63faw6RZ"/>

</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:bg-surface-container-low transition-colors active:opacity-80 active:scale-95 duration-150">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<main class="px-container-margin pt-lg max-w-2xl mx-auto">
<!-- Profile Header Section -->
<section class="flex flex-col items-center mb-xl">
<div class="relative mb-md">
<div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-primary to-secondary-container">
<div class="w-full h-full rounded-full border-4 border-surface overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A close-up high-resolution profile picture of a young professional with a calm and confident expression. The lighting is soft and natural, emphasizing clarity and technological precision. The background is a minimalist blur of a modern tech office with hints of soft blue and white tones, matching a professional AI application aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMDZFy7xtHfcQn9c-KVZOw51D6agSLEa2os4j7uHuLZAP4AEczXkUoGtte2_B2TUjLsoZrrkC9wJYOWqNOpt8kKb-48HN40oRDNtYvHd0uugl3LVCxZ7KuzgGBcrMlenvE2b9II-ghg4nOjdFwGVFqCdtXUaL2Re5iFC7Uc86xT1sV62atDKdDu4ba6b1p7XGJC_IVA8mlel0FwKiLLpr1S6wjyquq--6fZitJWvymMy0-c49y2YVb"/>
</div>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary p-1.5 rounded-full shadow-lg border-2 border-surface flex items-center justify-center transition-transform active:scale-90">
<span class="material-symbols-outlined !text-[18px]">edit</span>
</button>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Kojo Mensah</h1>
<p class="font-body-md text-body-md text-on-surface-variant">kojo.mensah@haki.ai</p>
</section>
<!-- Stats Grid -->
<section class="grid grid-cols-2 gap-gutter mb-xl">
<div class="bg-surface-container-low p-md rounded-xl border border-outline-variant shadow-sm flex flex-col items-center text-center">
<span class="material-symbols-outlined text-primary mb-sm">audio_file</span>
<span class="text-display-lg font-display-lg text-primary">124</span>
<span class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Recordings Processed</span>
</div>
<div class="bg-surface-container-low p-md rounded-xl border border-outline-variant shadow-sm flex flex-col items-center text-center">
<span class="material-symbols-outlined text-secondary mb-sm">timer</span>
<span class="text-display-lg font-display-lg text-secondary">840</span>
<span class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Minutes Transcribed</span>
</div>
</section>
<!-- Menu List -->
<section class="bg-surface-container-lowest rounded-2xl overflow-hidden border border-outline-variant">
<div class="divide-y divide-outline-variant">
<!-- Edit Profile -->
<button class="w-full flex items-center justify-between px-md py-lg hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined">person_edit</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Edit Profile</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<!-- Settings -->
<button class="w-full flex items-center justify-between px-md py-lg hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Settings</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<!-- Help -->
<button class="w-full flex items-center justify-between px-md py-lg hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">help</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Help</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<!-- About -->
<button class="w-full flex items-center justify-between px-md py-lg hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">info</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">About</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<!-- Logout -->
<button class="w-full flex items-center justify-between px-md py-lg hover:bg-error-container/20 transition-colors group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center text-on-error-container">
<span class="material-symbols-outlined">logout</span>
</div>
<span class="font-body-lg text-body-lg text-error">Logout</span>
</div>
<span class="material-symbols-outlined text-error/60 group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
</section>
<!-- Language Preference (Bonus cultural nuance) -->
<div class="mt-xl p-md rounded-xl bg-secondary-container/10 border border-secondary/20 flex items-center justify-between">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary">translate</span>
<span class="text-body-md font-body-md text-on-secondary-container">Active Translation: <strong>Ga (Gã)</strong></span>
</div>
<button class="text-primary text-label-md font-label-md underline underline-offset-4">Change</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-surface shadow-sm border-t border-outline-variant pb-safe px-2 rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-2 rounded-lg">
<span class="material-symbols-outlined">home</span>
<span class="text-label-md font-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-2 rounded-lg">
<span class="material-symbols-outlined">history</span>
<span class="text-label-md font-label-md">History</span>
</button>
<button class="flex flex-col items-center justify-center -mt-8 bg-primary w-14 h-14 rounded-full shadow-lg text-on-primary active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined !text-[32px]">add_circle</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-2 rounded-lg">
<span class="material-symbols-outlined">notifications</span>
<span class="text-label-md font-label-md">Alerts</span>
</button>
<button class="active-nav-item flex flex-col items-center justify-center text-primary font-semibold hover:bg-surface-container-low transition-colors px-4 py-2 rounded-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-label-md font-label-md">Profile</span>
</button>
</nav>
<script>
        // Micro-interaction for list items
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.classList.add('opacity-80', 'scale-[0.98]');
            });
            btn.addEventListener('touchend', function() {
                this.classList.remove('opacity-80', 'scale-[0.98]');
            });
        });
    </script>
</body></html>
