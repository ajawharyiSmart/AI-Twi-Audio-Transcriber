<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HAKI Onboarding - Transcribe Ga</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-tint": "#0053db",
                    "tertiary-fixed-dim": "#ffb596",
                    "primary-container": "#2563eb",
                    "inverse-on-surface": "#eef0ff",
                    "inverse-surface": "#283044",
                    "on-primary-fixed": "#00174b",
                    "primary-fixed-dim": "#b4c5ff",
                    "error": "#ba1a1a",
                    "surface": "#faf8ff",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#360f00",
                    "primary": "#004ac6",
                    "surface-container-high": "#e2e7ff",
                    "background": "#faf8ff",
                    "on-surface-variant": "#434655",
                    "surface-container-low": "#f2f3ff",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#005236",
                    "secondary-fixed-dim": "#4edea3",
                    "on-tertiary-container": "#ffede6",
                    "tertiary": "#943700",
                    "on-primary-container": "#eeefff",
                    "surface-bright": "#faf8ff",
                    "outline-variant": "#c3c6d7",
                    "secondary-fixed": "#6ffbbe",
                    "tertiary-fixed": "#ffdbcd",
                    "inverse-primary": "#b4c5ff",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#131b2e",
                    "on-secondary-container": "#00714d",
                    "on-primary": "#ffffff",
                    "primary-fixed": "#dbe1ff",
                    "error-container": "#ffdad6",
                    "surface-container": "#eaedff",
                    "outline": "#737686",
                    "on-secondary-fixed": "#002113",
                    "surface-container-highest": "#dae2fd",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-error": "#ffffff",
                    "on-surface": "#131b2e",
                    "secondary-container": "#6cf8bb",
                    "surface-variant": "#dae2fd",
                    "secondary": "#006c49",
                    "tertiary-container": "#bc4800",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d2d9f4"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "16px",
                    "xl": "32px",
                    "unit": "4px",
                    "xs": "4px",
                    "lg": "24px",
                    "container-margin": "16px",
                    "gutter": "12px",
                    "sm": "8px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "headline-sm": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg": ["Inter"],
                    "transcription-text": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "transcription-text": ["18px", {"lineHeight": "32px", "letterSpacing": "0.01em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .waveform-bar {
            animation: waveform-pulse 1.2s ease-in-out infinite;
        }
        @keyframes waveform-pulse {
            0%, 100% { height: 12px; opacity: 0.6; }
            50% { height: 32px; opacity: 1; }
        }
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center overflow-hidden">
<!-- Top AppBar (Simplified for Onboarding) -->
<header class="flex justify-between items-center w-full px-container-margin py-sm h-16 fixed top-0 z-50">
<span class="text-headline-md font-headline-md font-bold text-primary">HAKI</span>
<button class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors px-4 py-2">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center w-full max-w-md px-container-margin pt-16 pb-24">
<!-- Illustration Container -->
<div class="relative w-full aspect-square flex items-center justify-center mb-xl fade-in-up" style="animation-delay: 0.1s;">
<!-- Subtle Tonal Background Circle -->
<div class="absolute inset-0 m-auto w-64 h-64 bg-surface-container-high rounded-full opacity-50 blur-3xl"></div>
<!-- Central Card with Visualization -->
<div class="relative z-10 w-64 h-64 bg-surface-container-lowest rounded-full border border-outline-variant shadow-lg flex flex-col items-center justify-center p-lg overflow-hidden group">
<!-- Static Waveform Visualizer -->
<div class="flex items-end gap-1 mb-md h-12">
<div class="waveform-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.1s;"></div>
<div class="waveform-bar w-1.5 bg-primary-container rounded-full" style="animation-delay: 0.3s;"></div>
<div class="waveform-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.5s;"></div>
<div class="waveform-bar w-1.5 bg-secondary-container rounded-full" style="animation-delay: 0.2s;"></div>
<div class="waveform-bar w-1.5 bg-primary-container rounded-full" style="animation-delay: 0.4s;"></div>
<div class="waveform-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.6s;"></div>
</div>
<!-- Central Icon -->
<div class="w-16 h-16 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-md mb-2 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[32px]">mic</span>
</div>
<span class="text-label-md font-label-md text-on-surface-variant opacity-70">RECORDING GA...</span>
</div>
<!-- Floating Decorative Elements -->
<div class="absolute top-10 right-10 w-12 h-12 bg-secondary-fixed text-on-secondary-fixed rounded-xl flex items-center justify-center shadow-sm -rotate-12 animate-bounce">
<span class="material-symbols-outlined">translate</span>
</div>
<div class="absolute bottom-10 left-10 w-10 h-10 bg-tertiary-fixed text-on-tertiary-fixed rounded-lg flex items-center justify-center shadow-sm rotate-6">
<span class="material-symbols-outlined text-[20px]">description</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center w-full px-4 fade-in-up" style="animation-delay: 0.3s;">
<h1 class="text-display-lg font-display-lg text-on-surface mb-md">
                Transcribe Ga Speech
            </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant leading-relaxed">
                Upload or record audio and convert spoken Ga into precise text using our specialized AI model.
            </p>
</div>
<!-- Progress Indicator -->
<div class="mt-xl flex gap-2 fade-in-up" style="animation-delay: 0.4s;">
<div class="w-8 h-2 bg-primary rounded-full"></div>
<div class="w-2 h-2 bg-surface-container-highest rounded-full"></div>
<div class="w-2 h-2 bg-surface-container-highest rounded-full"></div>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full p-container-margin flex flex-col gap-md bg-gradient-to-t from-background via-background to-transparent pt-8 z-50">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-sm active:scale-[0.98] transition-all hover:bg-primary-container">
            Next
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Feature Highlights Bento-ish (Subtle) -->
<div class="grid grid-cols-2 gap-sm w-full max-w-md mx-auto">
<div class="p-md bg-surface-container-low rounded-xl flex items-center gap-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-primary">upload_file</span>
<span class="text-label-md font-label-md text-on-surface">Upload MP3/WAV</span>
</div>
<div class="p-md bg-surface-container-low rounded-xl flex items-center gap-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary">bolt</span>
<span class="text-label-md font-label-md text-on-surface">Live Results</span>
</div>
</div>
</footer>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 pointer-events-none -z-10 opacity-30">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary-container rounded-full blur-[120px]"></div>
</div>
<script>
        // Simple micro-interaction for the central mic button
        const micButton = document.querySelector('.group');
        let isRecording = true;

        setInterval(() => {
            if(isRecording) {
                const bars = document.querySelectorAll('.waveform-bar');
                bars.forEach(bar => {
                    bar.style.height = Math.floor(Math.random() * 30 + 10) + 'px';
                });
            }
        }, 150);
    </script>
</body></html>
