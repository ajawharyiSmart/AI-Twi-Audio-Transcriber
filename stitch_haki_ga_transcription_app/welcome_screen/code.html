<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;

        }
        .material-symbols-outlined {

        .floating {
            animation: floating 6s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .shimmer-text {
            background: linear-gradient(90deg, #004ac6 0%, #2563eb 50%, #004ac6 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);

<script>
        // Micro-interaction for primary button
        const primaryBtn = document.querySelector('button.bg-primary');
        if (primaryBtn) {
            primaryBtn.addEventListener('mousemove', (e) => {
                const rect = primaryBtn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                primaryBtn.style.setProperty('--x', `${x}px`);
                primaryBtn.style.setProperty('--y', `${y}px`);
            });
        }
